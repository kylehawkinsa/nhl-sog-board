<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg"><link rel="apple-touch-icon" href="icons/icon-192.png">
<title>NHL SOG Board</title><style>
:root{--bg:#0b0d10;--pn:#12161b;--ln:#232a33;--tx:#e6e9ee;--mu:#7d8794;--ac:#4cc2ff;--ok:#3ddc84;--bad:#ff5d5d;--warn:#ffb020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{padding:14px 14px 8px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:2}h1{margin:0;font-size:18px}h1 span{color:var(--ac)}
.sub{color:var(--mu);font-size:12px}.paper{display:inline-block;background:var(--warn);color:#000;font-weight:700;font-size:11px;padding:1px 6px;border-radius:3px;margin-left:6px}
main{max-width:900px;margin:0 auto;padding:10px 12px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin-bottom:10px}
.ph{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:12px}.bet{font-size:17px;font-weight:700;margin:4px 0}.Over{color:var(--ok)}.Under{color:#ff8a8a}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 10px;font-size:13px}.kv span{color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 4px;font-size:13px}nav button.on{color:var(--ac);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--ln);text-align:left}tr.c td{background:#16263a}
.big{font-size:22px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
details summary{cursor:pointer;font-weight:700}.off{display:none}</style></head><body>
<header><h1>NHL <span>SOG</span> Board<span class="paper">PAPER PICKS</span></h1><div class="sub" id="sub">loading…</div></header>
<main><section id="plays"></section><section id="games" class="off"></section><section id="record" class="off"></section><section id="alerts" class="off"></section></main>
<nav><button class="on" data-t="plays">Today</button><button data-t="games">Games</button><button data-t="record">Record</button><button data-t="alerts">Alerts</button></nav>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const am=x=>x==null?"–":(x>0?"+":"")+Math.round(x),pc=(x,d=1)=>x==null?"–":(100*x).toFixed(d)+"%",pt=x=>x==null?"–":((x>0?"+":"")+(100*x).toFixed(1)),n=(x,d=2)=>x==null?"–":(+x).toFixed(d);
const BK={draftkings:"DK",fanduel:"FD",caesars:"CZ",pinnacle:"PN"};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll("main section").forEach(s=>s.classList.toggle("off",s.id!==b.dataset.t));scrollTo(0,0)});
function play(r){return `<div class="card"><div class="ph"><b>${E(r.player)}</b><span class="mu">${E(r.team)} · ${E(r.matchup)} · ${E(r.start_et)}</span></div>
<div class="bet ${E(r.side)}">${E(r.side)} ${r.line} SOG ${am(r.price_am)} <span class="mu">${E(BK[r.book]||r.book)}${r.slow_book===true?" · SLOW BOOK":""}</span></div>
<div class="kv"><span>Model</span><b>${pc(r.model_prob)}</b><span>Consensus</span><b>${pc(r.novig_prob)}</b><span>Edge</span><b>${pt(r.edge)}</b><span>EV/$1</span><b>${n(r.ev_per_1,3)}</b>
<span>Stake</span><b>${n(r.stake_u)}u</b><span>Proj</span><b>${n(r.proj_sog)}</b></div><div class="mu">${E(String(r.lineup_status||"").split(" upd")[0])}</div></div>`}
function parl(r){return `<div class="card"><div class="ph"><b>Parlay #${r.rank} · ${am(r.parlay_am)}</b><span class="mu">${E(r.label)}</span></div>
<div class="bet Over">${E(r.l1_player)} ${E(r.l1_leg)} ${am(r.l1_price_am)} <span class="mu">${E(r.l1_matchup)} · ${pc(r.l1_p_true)}</span></div>
<div class="bet Over">${E(r.l2_player)} ${E(r.l2_leg)} ${am(r.l2_price_am)} <span class="mu">${E(r.l2_matchup)} · ${pc(r.l2_p_true)}</span></div>
<div class="kv"><span>True prob</span><b>${pc(r.p_true)}</b><span>EV/$1</span><b>${n(r.ev_per_1,3)}</b><span>Stake</span><b>1u</b></div></div>`}
function render(d,stale){
 $("#sub").innerHTML=`Board ${E(d.date)} · built ${E(d.built)} · main lines only · paper, not real bets${stale?' · <b class="warn">OFFLINE – cached board</b>':""}`;
 $("#plays").innerHTML=(d.plays.length?d.plays.map(play).join(""):`<div class="card mu">No main-line plays passed the filters for ${E(d.date)}.</div>`)
  +`<h3>Parlays <span class="mu">(separate paper tracker)</span></h3>`+((d.parlays||[]).length?d.parlays.map(parl).join(""):`<div class="card mu">No parlays today.</div>`);
 $("#games").innerHTML=d.games.map(g=>`<details class="card"><summary>${E(g.matchup)} <span class="mu">${E(g.start_et)} · ${g.rows.filter(r=>r.candidate===true).length} plays</span></summary>
 <table><tr><th>Player</th><th>Bet</th><th>Px</th><th>Proj</th><th>Edge</th></tr>${g.rows.map(r=>`<tr class="${r.candidate===true?"c":""}"><td>${E(r.player)} <span class="mu">${E(r.team)}</span></td><td>${E(r.side[0])}${r.line}</td><td>${am(r.price_am)} <span class="mu">${E(BK[r.book]||r.book)}</span></td><td>${n(r.proj_sog)}</td><td>${pt(r.edge)}</td></tr>`).join("")}</table></details>`).join("")||'<div class="card mu">No games.</div>';
 const R=d.record,bc=R.beat_close;
 $("#record").innerHTML=`<div class="grid"><div class="card"><div class="mu">Record (W-L-P)</div><div class="big">${R.w}-${R.l}-${R.p}</div><div class="mu">${R.pending} pending</div></div>
 <div class="card"><div class="mu">Units</div><div class="big ${R.units>=0?"ok":"bad"}">${R.units>=0?"+":""}${n(R.units)}u</div><div class="mu">${n(R.staked)}u staked (graded)</div></div>
 <div class="card"><div class="mu">Beat close vs ${pc(R.goal,0)} goal</div><div class="big ${bc==null?"":bc>=R.goal?"ok":"bad"}">${bc==null?"–":pc(bc,0)}</div><div class="mu">n=${R.clv_n} CLV-graded</div></div>
 <div class="card"><div class="mu">Avg CLV</div><div class="big">${pc(R.avg_clv_pct)}</div><div class="mu">main lines only</div></div></div>
 <div class="card"><b>Recent</b><table><tr><th>Date</th><th>Bet</th><th>Px</th><th>Res</th><th>P/L</th><th>CLV</th></tr>${R.recent.map(r=>`<tr><td>${E(r.date.slice(5))}</td><td>${E(r.bet)}</td><td>${am(r.price_am)}</td><td>${E(r.result)}</td><td>${n(r.pl_u)}</td><td>${pc(r.clv_pct)}</td></tr>`).join("")}</table></div>`;
 $("#alerts").innerHTML=(d.alerts.length?d.alerts.map(a=>`<div class="card ${E(a.lvl)}">${E(a.msg)}</div>`).join(""):'<div class="card mu">No alerts.</div>');
 const na=d.alerts.filter(a=>a.lvl!=="info").length;document.querySelector('[data-t=alerts]').textContent="Alerts"+(na?` (${na})`:"");
}
fetch("data.json",{cache:"no-store"}).then(r=>r.json()).then(d=>render(d,false)).catch(()=>caches.match("data.json").then(r=>r.json()).then(d=>render(d,true))).catch(()=>$("#sub").textContent="No board available offline yet.");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
